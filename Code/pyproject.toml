[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-dino-icd"
version = "0.1.0"
description = "Adaptive-DINO Image Copy Detection with APT tokenization and ASL loss"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "John Watson"}
]
keywords = ["image-copy-detection", "deep-learning", "vision-transformer", "dino"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.16.0",
    "numpy>=1.23.0",
    "pillow>=9.0.0",
    "albumentations>=1.3.0",
    "opencv-python>=4.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
augly = [
    "augly>=1.0.0",
]
all = [
    "adaptive-dino-icd[dev,augly]",
]

[project.urls]
Homepage = "https://github.com/Watson-John/ImageCopyDetection"
Repository = "https://github.com/Watson-John/ImageCopyDetection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
