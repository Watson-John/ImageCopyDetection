# Phase 1 DDP Test Configuration
# Quick sanity check for DDP with real DINOv3 model
#
# Uses real model but minimal training for testing DDP setup.
# Run with: sbatch scripts/slurm_sanity_ddp.sh

backbone:
  model_name: "facebook/dinov3-vitb16-pretrain-lvd1689m"
  offline_stub: false
  pretrained: true
  embed_dim: 768
  freeze_backbone: false

apt:
  entropy_scales: [8, 16, 32]
  min_patch_size: 8
  max_patch_size: 64
  entropy_thresholds:
    8: 0.3
    16: 0.5
    32: 0.7
  normalize_entropy: true
  embed_dim: 768
  smallest_patch_size: 16

loss:
  lambda_mtr: 0.5
  temperature: 0.07
  margin: 0.2
  use_hard_negatives: true
  normalize_features: true

data:
  # Use single subdirectory for faster loading during test
  disc_root: "/home/jowatson/Deep Learning/DISC21/refs_50k_0"
  ndec_annotation: "/home/jowatson/Deep Learning/NDEC/pairs_converted.csv"
  ndec_image_root: "/home/jowatson/Deep Learning/NDEC"
  image_size: 224
  disc_ratio: 0.7
  batch_size: 8  # Small batch for testing
  num_workers: 2
  crop_ratio_range: [0.3, 0.8]
  use_augly: false
  hard_aug_prob: 0.5

training:
  epochs: 2  # Quick test
  lr: 0.0001
  weight_decay: 0.01
  seed: 42
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  log_interval: 10
  save_interval: 1
  gradient_clip: 1.0
  warmup_steps: 0
